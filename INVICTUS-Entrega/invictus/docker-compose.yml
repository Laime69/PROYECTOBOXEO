services:
  db:
    image: postgres:16-alpine
    container_name: invictus-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hola123
      POSTGRES_DB: invictus_boxeo
    volumes:
      - pgdata:/var/lib/postgresql/data
      # La base se crea y llena automáticamente, en orden, la primera vez:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./database/seed-demo.sql:/docker-entrypoint-initdb.d/03-seed-demo.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d invictus_boxeo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: invictus-backend
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: hola123
      DB_NAME: invictus_boxeo
      JWT_SECRET: invictus_jwt_secret_key_2024
      JWT_EXPIRES_IN: 24h
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: invictus-frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
